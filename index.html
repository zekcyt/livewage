<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wage Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <nav>
            <div id="pageContainer">
                <button class="page" id="showWageBtn">Live Wage</button>
                <button class="page" id="showCalendarBtn">Calendar</button>
            </div>
        </nav>

        <div id="wageSection">
            <header>
                <h1>Stopwatch</h1>
                <h2 class="subtext">Live wage tracker with currency conversion</h2>
            </header>
            <section class="card">
                <div id="rateContainer">
                    <label for="rate">Hourly rate</label>
                    <div class="rate-row">
                        <input type="number" id="rate" placeholder="e.g. 20">
                        <div id="currencyContainer">
                            <button onclick="setCurrency()" class="dropbtn">Currency ⌄</button>
                            <div id="rateDropdown" class="dropdown-content">
                                    <a href="#usd">USD</a>
                                    <a href="#eur">EUR</a>
                                    <a href="#pln">PLN</a>
                                    <a href="#gbp">GBP</a>
                                    <a href="#jpy">JPY</a>
                                    <a href="#cny">CNY</a>
                                    <a href="#aud">AUD</a>
                                    <a href="#cad">CAD</a>
                                    <a href="#chf">CHF</a>
                                    <a href="#rub">RUB</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="time">
                    <span class="digit" id="hr">00</span><span class="txt">:</span><span class="digit" id="min">00</span><span class="txt">:</span><span class="digit" id="sec">00</span><span class="txt">.</span><span class="digit ms" id="count">00</span>
                </div>
                <p class="earnings">Earnings <span class="amount">$<span id="earnings">0.00</span></span></p>
                <div id="buttons">
                    <button class="btn primary" id="start">Start</button>
                    <button class="btn" id="stop">Stop</button>
                    <button class="btn" id="reset">Reset</button>
                </div>
            </section>
        
        </div>

        <div id="calendarSection" style="display: none;">
            <header>
                <h1>Heatmap</h1>
                <h2 class="subtext">Visualize your earnings over time</h2>
            </header>
                <section class="card">
                    <div class="calendarWrapper">
                        <div id="calendarMonths" class="calendarMonths"></div>
                        
                        <div class="calendarBody">
                            <div class="calendarDays">
                                <span>Mon</span>
                                <span>Wed</span>
                                <span>Fri</span>
                            </div>
                            
                            <div id="calendarGrid" class="calendarGrid"></div>
                        </div>
                    </div>
                </section>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
